; PlatformIO Project Configuration File for SkyForge Drone Controller
; Target: ESP32 / ESP32-S3 Microcontroller

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=2
    -D CONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    electroniccats/MPU6050@^1.3.1
